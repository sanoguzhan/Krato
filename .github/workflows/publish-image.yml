name: Publish Image

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-image-release
  cancel-in-progress: true

jobs:
  version:
    name: Compute Version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.semantic.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute semantic version
        uses: paulhatch/semantic-version@v5.4.0
        id: semantic
        with:
          tag_prefix: "v"
          major_pattern: "/!:|BREAKING CHANGE:/"

  build-draft:
    name: Build And Push Draft
    runs-on: ubuntu-latest
    needs: version
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image name
        id: image
        shell: bash
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "name=ghcr.io/${repo}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push draft
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.image.outputs.name }}:draft-${{ github.sha }}

  check:
    name: Validate Draft Image
    runs-on: ubuntu-latest
    needs: build-draft
    permissions:
      contents: read
      packages: read
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke test draft image
        run: |
          image_ref="${{ needs.build-draft.outputs.image }}@${{ needs.build-draft.outputs.digest }}"
          docker pull "${image_ref}"
          docker inspect "${image_ref}" > /dev/null
          echo "Image sanity check passed"

  promote:
    name: Promote To Release Tags
    runs-on: ubuntu-latest
    needs: [version, build-draft, check]
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install crane
        uses: imjasonh/setup-crane@v0.4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote draft to release tags
        env:
          IMAGE: ${{ needs.build-draft.outputs.image }}
          DIGEST: ${{ needs.build-draft.outputs.digest }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          SOURCE="${IMAGE}@${DIGEST}"
          crane copy "${SOURCE}" "${IMAGE}:v${VERSION}"
          crane copy "${SOURCE}" "${IMAGE}:latest"

      - name: Update Helm chart version
        uses: mikefarah/yq@v4.47.2
        env:
          VERSION: ${{ needs.version.outputs.version }}
        with:
          cmd: >-
            yq -i
            '.version = strenv(VERSION) | .appVersion = "v" + strenv(VERSION)'
            charts/krato/Chart.yaml

      - name: Commit Helm chart version
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add charts/krato/Chart.yaml
          if git diff --cached --quiet; then
            echo "Chart.yaml already contains version v${VERSION}"
            exit 0
          fi
          git commit -m "chore(chart): release v${VERSION} [skip ci]"
          git pull --rebase origin "${TARGET_BRANCH}"
          git push origin "HEAD:${TARGET_BRANCH}"
