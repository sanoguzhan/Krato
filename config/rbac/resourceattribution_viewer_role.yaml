# This rule is not used by the project kubernetes-resource-attribution-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to attribution.krato.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kubernetes-resource-attribution-operator
    app.kubernetes.io/managed-by: kustomize
  name: resourceattribution-viewer-role
rules:
- apiGroups:
  - attribution.krato.io
  resources:
  - resourceattributions
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - attribution.krato.io
  resources:
  - resourceattributions/status
  verbs:
  - get
