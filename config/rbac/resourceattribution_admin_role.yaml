# This rule is not used by the project kubernetes-resource-attribution-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over attribution.krato.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kubernetes-resource-attribution-operator
    app.kubernetes.io/managed-by: kustomize
  name: resourceattribution-admin-role
rules:
- apiGroups:
  - attribution.krato.io
  resources:
  - resourceattributions
  verbs:
  - '*'
- apiGroups:
  - attribution.krato.io
  resources:
  - resourceattributions/status
  verbs:
  - get
