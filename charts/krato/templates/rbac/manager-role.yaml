apiVersion: rbac.authorization.k8s.io/v1
{{- if .Values.rbac.namespaced }}
kind: Role
{{- else }}
kind: ClusterRole
{{- end }}
metadata:
{{- if .Values.rbac.namespaced }}
  namespace: {{ .Release.Namespace }}
{{- end }}
  name: {{ include "kubernetes-resource-attribution-operator.resourceName" (dict "suffix" "manager-role" "context" $) }}
rules:
- apiGroups:
  - ""
  - metrics.k8s.io
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - attribution.krato.io
  resources:
  - resourceattributions
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - attribution.krato.io
  resources:
  - resourceattributions/finalizers
  verbs:
  - update
- apiGroups:
  - attribution.krato.io
  resources:
  - resourceattributions/status
  verbs:
  - get
  - patch
  - update
